<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120D" />
      <stop offset="50%" stop-color="#0A2E20" />
      <stop offset="100%" stop-color="#0A3A2C" />
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="50%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A9D8F" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glowing Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.85" filter="url(#glow)" />

  <!-- Stylized WASP Monogram 'W' -->
  <path d="M 140 160 L 200 350 L 256 220 L 312 350 L 372 160"
        fill="none"
        stroke="url(#wGrad)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Center Accent Spark -->
  <circle cx="256" cy="220" r="10" fill="#34D399" />
</svg>
